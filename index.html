<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine's Day</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      html,
      body {
        height: 100%;
        min-height: 100vh;
        overflow: hidden;
        position: fixed;
        width: 100%;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      body {
        background: linear-gradient(to bottom, #fce7f3, #fbcfe8, #f9a8d4);
        background-attachment: fixed;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0);
          opacity: 1;
        }
        100% {
          transform: translateY(-120vh);
          opacity: 0;
        }
      }

      .heart {
        position: absolute;
        bottom: -10vh;
        animation: floatUp linear infinite;
        pointer-events: none;
      }

      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      .typewriter {
        overflow: hidden;
        border-right: 0.15em solid #ec4899;
        white-space: nowrap;
        margin: 0 auto;
        animation: typing 2s steps(30, end), blink 0.75s step-end infinite;
        display: inline-block;
        max-width: 100%;
      }

      @keyframes blink {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: #ec4899;
        }
      }

      @keyframes confettiFall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }

      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        z-index: 999;
        animation: confettiFall linear forwards;
      }

      @keyframes heartbeat {
        0%, 100% {
          transform: scale(1);
        }
        10%, 30% {
          transform: scale(1.3);
        }
        20%, 40% {
          transform: scale(1.1);
        }
      }

      .heart-pump {
        display: inline-block;
        animation: heartbeat 1.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div
      class="relative z-10 min-h-screen flex items-center justify-center px-4 sm:px-6 py-8"
    >
      <div
        class="bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-6 sm:p-10 max-w-xl w-full text-center"
      >
        <div id="before">
          <div class="flex justify-center mt-2">
            <img
              src="imgs/flowers.gif"
              alt="Valentine GIF"
              class="w-32 h-32 sm:w-40 sm:h-40 md:w-48 md:h-48 object-contain"
            />
          </div>

          <h1 class="text-3xl sm:text-4xl font-bold text-pink-600 mb-4 sm:mb-6">
            Happy Valentine's Day <span class="heart-pump">💗</span>
          </h1>
          <p class="text-base sm:text-lg font-bold text-gray-700 leading-relaxed">
            Hi Baby, Will You Be My Valentines?
          </p>
          <p
            id="noMsg"
            class="text-base sm:text-lg text-gray-700 leading-relaxed fw-bold min-h-[1.5rem]"
          ></p>
          <div class="mt-6 sm:mt-8 flex justify-center gap-4 sm:gap-6 relative">
            <button
              class="px-5 py-3 sm:px-6 sm:py-3 bg-pink-100 text-gray-700 rounded-xl font-semibold hover:bg-pink-200 active:scale-95 transition-transform text-base sm:text-lg"
              id="yesBtn"
            >
              yes <span class="align-middle heart-pump">💖</span>
            </button>
            <div class="relative inline-block" style="min-width: 80px; min-height: 48px;">
              <button
                class="px-5 py-3 sm:px-6 sm:py-3 bg-gray-300 text-gray-700 rounded-xl font-semibold hover:bg-gray-400 active:scale-95 transition-transform text-base sm:text-lg"
                id="noBtn"
              >
                no <span class="align-middle heart-pump">💔</span>
              </button>
            </div>
          </div>
        </div>

        <div id="after" class="hidden">
          <div class="flex justify-center mt-2">
            <img
              src="imgs/kiss.gif"
              alt="Valentine GIF"
              class="w-32 h-32 sm:w-40 sm:h-40 md:w-48 md:h-48 object-contain"
            />
          </div>

          <p class="text-pink-600 text-xl sm:text-2xl font-bold">
            <span id="typewriterText" class="typewriter">Yay! You said YES! <span class="heart-pump">💖💗</span></span>
          </p>
        </div>

        <p class="mt-4 sm:mt-6 text-sm sm:text-base text-pink-500 font-semibold">Made with love 💌</p>

        <audio id="bgMusic" autoplay loop>
          <source src="audio/loveconfession.mp3" type="audio/mpeg" />
        </audio>
      </div>
    </div>

    <button
      id="muteBtn"
      class="fixed top-6 right-6 md:top-4 md:right-4 z-50 w-14 h-14 md:w-12 md:h-12 bg-white/80 backdrop-blur-md rounded-full shadow-lg flex items-center justify-center cursor-pointer hover:scale-110 active:scale-95 transition-transform text-2xl md:text-xl"
      title="Toggle music"
    >
      🔊
    </button>

    <a href="https://github.com/w3ixi4ng/valentines_day"
      ><img
        src="imgs/GitHub.svg"
        alt="github"
        class="w-8 sm:w-10 fixed bottom-4 right-4 z-50 cursor-pointer hover:scale-110 active:scale-95 transition-transform"
        target="_blank"
    /></a>

    <script>
      const colors = ["💗", "💖", "💘", "💞", "💕"];

      function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = colors[Math.floor(Math.random() * colors.length)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 16 + "px";
        heart.style.animationDuration = Math.random() * 3 + 4 + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);
      }
      setInterval(createHeart, 300);

      const noBtn = document.getElementById("noBtn");
      const noMsg = document.getElementById("noMsg");
      const noMessages = [
        "Are you sure? 🥺",
        "Oops… that's not the answer I wanted 💔",
        "Try again… I believe in you! 💖",
        "No way! Come on, say Yes 😏",
        "You can't resist me forever 💗",
        "Even a 'No' can't stop my love for you 💘",
        "I'll wait… but I hope it's a Yes soon 🥰",
        "Every 'No' just makes me love you more 💖",
        "Your heart belongs to me anyway 💞",
        "Don't worry, I'll keep sending love 💌",
        "You clicked No… but I still love you! 😂",
        "Are you trying to break my heart? 💔😅",
        "No? Haha, I didn't think so 😏",
      ];

      function moveNoButton() {
        const isMobile = window.innerWidth < 640;
        const maxX = isMobile ? 50 : 40;
        const maxY = isMobile ? 50 : 40;
        const x = Math.random() * maxX;
        const y = Math.random() * maxY;
        const index = Math.floor(Math.random() * noMessages.length);
        noBtn.style.position = "absolute";
        noBtn.style.left = x + "vw";
        noBtn.style.top = y + "vh";
        noMsg.innerText = noMessages[index];
      }
      noBtn.addEventListener("mouseenter", moveNoButton);
      noBtn.addEventListener("click", moveNoButton);
      noBtn.addEventListener("touchstart", moveNoButton);

      const music = document.getElementById("bgMusic");
      document.body.addEventListener(
        "click",
        () => {
          music.play();
        },
        { once: true },
      );

      const yesBtn = document.getElementById("yesBtn");
      const beforeDiv = document.getElementById("before");
      const afterDiv = document.getElementById("after");

      function createConfetti() {
        const colors = ["#ff69b4", "#ff1493", "#ffc0cb", "#ffb6c1", "#ff6b9d", "#c71585"];
        const confettiCount = 100;

        for (let i = 0; i < confettiCount; i++) {
          setTimeout(() => {
            const confetti = document.createElement("div");
            confetti.classList.add("confetti");
            confetti.style.left = Math.random() * 100 + "vw";
            confetti.style.top = "-10px";
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = Math.random() * 2 + 3 + "s";
            confetti.style.animationDelay = "0s";

            document.body.appendChild(confetti);

            setTimeout(() => {
              confetti.remove();
            }, 5000);
          }, i * 30);
        }
      }

      yesBtn.addEventListener("click", () => {
        beforeDiv.classList.add("hidden");
        afterDiv.classList.remove("hidden");
        createConfetti();
      });

      const muteBtn = document.getElementById("muteBtn");
      let isMuted = false;

      muteBtn.addEventListener("click", () => {
        isMuted = !isMuted;
        music.muted = isMuted;
        muteBtn.innerText = isMuted ? "🔇" : "🔊";
      });
    </script>
  </body>
</html>
